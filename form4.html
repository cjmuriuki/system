<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="welcome_page">
        <div class="welcome_page_items form4">
            <h1>ADMINISTRATOR</h1>
            <hr> <br>
            <!-- Added 'id="admin_login_form"' to the form for JS handling -->
            <form id="admin_login_form">
                <div>
                    <label class="login_label" for="username">USERNAME</label>
                    <input id="username" class="admin_login_input" type="text" placeholder="Enter your username" required>  
                    <br>
                </div>
                <div>
                    <label class="login_label" for="password">PASSWORD</label>
                    <input id="password" class="admin_login_input" type="password" placeholder="Enter password" required>
                    <br>
                </div>
                <button type="submit" class="welcome_btn" id="login_btn">LOGIN</button>  
            </form>
            <a href="index.html"><button class="welcome_btn">MAIN MENU</button></a>  
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
