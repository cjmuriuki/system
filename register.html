<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Thika Technical College Voting System</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italianno&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="welcome_page">
        <div class="welcome_page_items form5">
            <h1>REGISTER AN ACCOUNT</h1>
            <hr>

            <form id="register_form" class="students_form">
                <div>
                    <label for="adm_no">Admission Number</label>
                    <input type="text" id="adm_no" name="adm_no" placeholder="12345678" required>
                </div>

                <div>
                    <label for="student_name">Full Name</label>
                    <input type="text" id="student_name" name="student_name" placeholder="James Kinuthia" required>
                </div>

                <div>
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="" disabled selected>Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter a strong password" required minlength="4">
                </div>

                <button type="submit" class="welcome_btn">Register</button>
            </form>

            <p>Already have an account?</p>
            <a href="form2.html"><button type="button" class="welcome_btn" id="login_btn">Login</button></a>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>

</body>
</html>
